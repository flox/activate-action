name: "Flox Activate"
description: "Run a command inside a Flox environment"
author: "Flox <hello@flox.dev>"

branding:
  color: "blue"
  icon: "moon"

inputs:
  command:
    description: "A command to run inside the Flox environment."
    required: true
  environment:
    description: "Environment to run the command in. If not specified it will try to find local Flox environment."
    default: null
  dir:
    description: "Path containing a .flox/ directory."
    default: null
  trust:
    description: >-
      Trust the FloxHub environment for this activation only, passing
      `--trust` to `flox activate`. Activation hooks run arbitrary code,
      so Flox refuses to activate a FloxHub environment it does not
      already trust, and a runner has no terminal to answer the prompt
      on. Also covers remote environments pulled in by `[include]`.
      Prefer trusting the environment once at install time — see the
      "Trusting FloxHub environments" section of the README.
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Run flox activate"
      shell: "bash"
      # Inputs reach the script only as environment variables, so their values
      # are never parsed as shell. Flox reads every `FLOX_*` variable as config,
      # hence the `INPUT_` prefix.
      env:
        INPUT_COMMAND: "${{ inputs.command }}"
        INPUT_ENVIRONMENT: "${{ inputs.environment }}"
        INPUT_DIR: "${{ inputs.dir }}"
        INPUT_TRUST: "${{ inputs.trust == 'true' }}"
      run: |
        args=()
        if [[ -n "$INPUT_ENVIRONMENT" ]]; then
          args+=("-r=$INPUT_ENVIRONMENT")
        fi
        if [[ -n "$INPUT_DIR" ]]; then
          args+=("--dir=$INPUT_DIR")
        fi
        if [[ "$INPUT_TRUST" == "true" ]]; then
          args+=("--trust")
        fi
        flox activate "${args[@]}" -c "$INPUT_COMMAND"
