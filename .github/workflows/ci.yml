name: "CI"

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

env:
  FLOX_DISABLE_METRICS: "true"

jobs:

  test-action:
    name: "Github Action Test"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        channel:
          - "stable"
          - "nightly"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6


      - name: "Install Flox"
        uses: flox/install-flox-action@dc880156f423b1b9f03534c3ccbb3bc3bb8c223e # main

        with:
          channel: "${{ matrix.channel }}"

      - name: "Test Remote environment"
        uses: "./"
        with:
          environment: "flox/python-pip"
          command: "python --version"

      - name: "Test Local Action"
        uses: "./"
        with:
          command: "python --version"
          dir: "./test-env"
          # Passed here so that a real `flox` sees `--trust` on every run. The
          # stub in `test-arguments` would record the flag just as happily if a
          # Flox release renamed or removed it.
          trust: true

      - name: "Test quotes in command"
        uses: "./"
        with:
          dir: "./test-env"
          command: |
            greeting='hello world'
            test "$greeting" = 'hello world'

  test-arguments:
    name: "Argument Construction"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Flox is deliberately not installed for this job. `test-stub/flox`
      # records the arguments the action builds, which is this action's
      # responsibility; whether Flox honours `--trust` is Flox's, and is
      # covered by `m10.0`-`m10.3` in its `environment-remote.bats` suite.
      # Recording argv keeps these tests hermetic — no FloxHub environment to
      # depend on and no network.
      - name: "Install the recording flox stub"
        shell: "bash"
        run: |
          chmod +x "$GITHUB_WORKSPACE/test-stub/flox"
          echo "$GITHUB_WORKSPACE/test-stub" >> "$GITHUB_PATH"

      - name: "Record a remote activation with trust"
        uses: "./"
        env:
          STUB_ARGV_FILE: "${{ runner.temp }}/argv-remote-trust"
        with:
          environment: "my-org/my-env"
          command: "true"
          trust: true

      - name: "Record a remote activation without trust"
        uses: "./"
        env:
          STUB_ARGV_FILE: "${{ runner.temp }}/argv-remote"
        with:
          environment: "my-org/my-env"
          command: "true"

      - name: "Record a directory activation"
        uses: "./"
        env:
          STUB_ARGV_FILE: "${{ runner.temp }}/argv-dir"
        with:
          dir: "./test-env"
          command: "true"

      - name: "Record a command containing quotes"
        uses: "./"
        env:
          STUB_ARGV_FILE: "${{ runner.temp }}/argv-quotes"
        with:
          dir: "./test-env"
          command: |
            greeting='hello world'
            test "$greeting" = 'hello world'

      - name: "Check the arguments"
        shell: "bash"
        run: |
          argv=()
          read_argv() {
            argv=()
            while IFS= read -r -d '' arg; do argv+=("$arg"); done < "$1"
          }
          has() {
            local candidate
            for candidate in "${argv[@]}"; do
              if [[ "$candidate" == "$1" ]]; then return 0; fi
            done
            return 1
          }
          fail() {
            echo "$1" >&2
            printf '  argv: %q\n' "${argv[@]}" >&2
            exit 1
          }

          read_argv "$RUNNER_TEMP/argv-remote-trust"
          if ! has "-r=my-org/my-env"; then fail "environment should become -r="; fi
          if ! has "--trust"; then fail "trust: true should add --trust"; fi

          read_argv "$RUNNER_TEMP/argv-remote"
          if ! has "-r=my-org/my-env"; then fail "environment should become -r="; fi
          if has "--trust"; then fail "an unset trust should not add --trust"; fi
          if has "--dir="; then fail "an unset dir should not add --dir="; fi

          read_argv "$RUNNER_TEMP/argv-dir"
          if ! has "--dir=./test-env"; then fail "dir should become --dir="; fi
          if has "--trust"; then fail "an unset trust should not add --trust"; fi

          # The command must reach Flox as one argument, byte for byte. v1
          # wrapped it in single quotes inside the script, so a command
          # containing one was split here.
          read_argv "$RUNNER_TEMP/argv-quotes"
          expected="$(cat <<'EOF'
          greeting='hello world'
          test "$greeting" = 'hello world'
          EOF
          )"

          # Whether the block scalar's trailing newline survives is YAML's
          # business, not this action's, so normalise it away on both sides.
          actual="${argv[3]}"
          while [[ "$actual" == *$'\n' ]]; do actual="${actual%$'\n'}"; done

          if [[ "${#argv[@]}" -ne 4 ]]; then
            fail "a command with quotes and newlines must stay a single argument"
          fi
          if [[ "$actual" != "$expected" ]]; then
            fail "the command reached Flox altered"
          fi

          echo "Argument assertions passed."
